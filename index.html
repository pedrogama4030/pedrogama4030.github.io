<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Gama 4030 — Crie sua Foto de Apoio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --azul: #1e3a8a; --azul-escuro: #0f1f4a; --amarelo: #f59e0b; --laranja: #ea580c; --branco: #ffffff; }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Montserrat',sans-serif;background:linear-gradient(180deg,var(--azul-escuro),var(--azul));color:var(--branco);min-height:100vh}

        /* Banner: mostrar inteiro sem cortar */
        .banner-topo{width:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,rgba(15,31,74,1),rgba(30,58,138,1));min-height:180px}
        .banner-topo img{max-width:100%;height:auto;display:block;object-fit:contain}

        .container{max-width:520px;margin:0 auto;padding:20px}
        .faixa-cores{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:16px}
        .faixa-cores span{flex:1}
        .faixa-cores span:nth-child(1){background:#dc2626}
        .faixa-cores span:nth-child(2){background:#f59e0b}
        .faixa-cores span:nth-child(3){background:#16a34a}
        .faixa-cores span:nth-child(4){background:#1e3a8a}

        h1{text-align:center;font-size:1.6rem;font-weight:800;margin-bottom:8px}
        h1 span{color:var(--amarelo)}
        .subtitulo{text-align:center;opacity:.9;margin-bottom:20px}

        .upload-card{background:rgba(255,255,255,0.06);border:2px dashed rgba(255,255,255,0.2);border-radius:16px;padding:28px;text-align:center;cursor:pointer}
        input[type=file]{display:none}

        .preview-area{display:none;margin-top:20px;text-align:center}
        .preview-area.active{display:block}

        /*
          O molde (moldura.png) NÃO é um círculo perfeito: é um círculo com uma
          faixa retangular "PEDRO GAMA 4030" colada embaixo, então a proporção
          real da arte é 862x972 (mais alta do que larga). Por isso o wrapper
          usa aspect-ratio em vez de largura=altura fixas com border-radius:50%
          -- isso é o que fazia a moldura "esticar" e desalinhar do círculo.
        */
        .preview-wrapper{
            width:min(320px, 82vw);
            aspect-ratio:862/972;
            margin:0 auto;
            border-radius:18px;
            overflow:hidden;
            position:relative;
            background:#fff;
            box-shadow:0 12px 30px rgba(0,0,0,0.3);
            touch-action:none;
        }
        .preview-wrapper canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
        .preview-wrapper canvas:active{cursor:grabbing}
        #previewPhoto{display:none}

        .controls{display:none;margin-top:18px}
        .controls.active{display:block}
        .slider-box{background:rgba(255,255,255,0.06);padding:12px;border-radius:12px;margin-bottom:12px}
        input[type=range]{width:100%}

        .botoes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
        .btn{padding:12px 18px;border-radius:10px;font-weight:700;border:none;cursor:pointer;font-size:1rem}
        .btn-primary{background:linear-gradient(135deg,var(--amarelo),var(--laranja));color:#07123a}
        .btn-secondary{background:rgba(255,255,255,0.12);color:var(--branco)}

        .rodape{text-align:center;margin-top:28px;opacity:.7;font-size:.85rem}

        /* Responsivo mobile */
        @media (max-width: 480px) {
            .banner-topo{min-height:140px;padding:12px}
            .container{padding:16px}
            h1{font-size:1.4rem}
            .btn{padding:10px 16px;font-size:0.95rem}
        }

        #hiddenLink{display:none}
    </style>
</head>
<body>

    <div class="banner-topo">
        <img src="./banner.png" alt="Banner Pedro Gama 4030">
    </div>

    <div class="container">
        <div class="faixa-cores"><span></span><span></span><span></span><span></span></div>
        <h1>Crie sua Foto de <span>Apoio</span></h1>
        <p class="subtitulo">Escolha sua foto, ajuste e baixe</p>

        <div class="upload-card" id="dropZone" onclick="fileInput.click()">
            <div style="font-size:28px">📷</div>
            <div style="font-weight:700;margin-top:8px">Clique ou arraste sua foto</div>
            <div style="opacity:.85;margin-top:6px">JPG / PNG / WEBP</div>
        </div>
        <input id="fileInput" type="file" accept="image/*">

        <div id="previewArea" class="preview-area">
            <div class="preview-wrapper">
                <canvas id="previewCanvas"></canvas>
                <img id="previewPhoto" alt="source">
            </div>
        </div>

        <div id="controlsArea" class="controls">
            <div class="slider-box">
                <label style="display:flex;justify-content:space-between;align-items:center;font-weight:700">🔍 Ajustar tamanho <span id="zoomValue">100%</span></label>
                <input id="zoomRange" type="range" min="50" max="200" value="100">
            </div>
            <div class="botoes">
                <button class="btn btn-primary" onclick="baixarFoto()">⬇️ Baixar Foto</button>
                <button class="btn btn-secondary" onclick="refazer()">🔄 Trocar Foto</button>
            </div>
        </div>

        <div class="rodape"> <strong>PEDRO GAMA 4030</strong> • É por Minas, é pra valer!</div>
    </div>

    <canvas id="canvasFinal" style="display:none"></canvas>
    <a id="hiddenLink" style="display:none"></a>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const previewArea = document.getElementById('previewArea');
        const previewPhoto = document.getElementById('previewPhoto');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');
        const controlsArea = document.getElementById('controlsArea');
        const zoomRange = document.getElementById('zoomRange');
        const zoomValue = document.getElementById('zoomValue');
        const canvasFinal = document.getElementById('canvasFinal');
        const ctxFinal = canvasFinal.getContext('2d');
        const hiddenLink = document.getElementById('hiddenLink');

        // ---- Geometria real do furo circular dentro de moldura.png ----
        // Medida diretamente na imagem (862x972): centro e raio do círculo
        // onde a foto deve aparecer. Como frações da largura/altura da
        // moldura, então funcionam em qualquer resolução de saída.
        const HOLE_CX_FRAC = 0.49746921862382604; // relativo à largura
        const HOLE_CY_FRAC = 0.4967680136192201;  // relativo à altura
        const HOLE_R_FRAC  = 0.3082262758284626;  // relativo à largura

        const OUTPUT_WIDTH = 1080; // resolução final (px) do download

        let fotoCarregada = false, molduraLoaded = false, zoomAtual = 100;

        // Pan (em pixels da imagem de origem, sem clamping — arraste livre)
        let panOffsetX = 0, panOffsetY = 0;
        let dragging = false, pointerId = null, startPointerX = 0, startPointerY = 0, startPanX = 0, startPanY = 0;

        const molduraImage = new Image();
        molduraImage.crossOrigin = 'anonymous';
        molduraImage.src = './moldura.png';
        molduraImage.onload = () => { molduraLoaded = true; renderPreview(); };
        molduraImage.onerror = () => { console.warn('Erro ao carregar moldura.png — confira o nome/caminho do arquivo no repositório.'); };

        fileInput.addEventListener('change', e => {
            const f = e.target.files[0]; if (!f) return;
            if (!f.type.startsWith('image/')) { alert('Envie uma imagem'); return; }
            const r = new FileReader();
            r.onload = ev => {
                previewPhoto.src = ev.target.result;
                previewPhoto.onload = () => {
                    fotoCarregada = true;
                    previewArea.classList.add('active');
                    controlsArea.classList.add('active');
                    zoomAtual = 100; zoomRange.value = 100; zoomValue.textContent = '100%';
                    panOffsetX = 0; panOffsetY = 0;
                    renderPreview();
                };
            };
            r.readAsDataURL(f);
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }));
        dropZone.addEventListener('drop', e => { const dt = e.dataTransfer; if (dt && dt.files && dt.files.length) { fileInput.files = dt.files; fileInput.dispatchEvent(new Event('change')); } });

        zoomRange.addEventListener('input', () => { zoomAtual = parseInt(zoomRange.value); zoomValue.textContent = zoomAtual + '%'; renderPreview(); });

        previewCanvas.addEventListener('pointerdown', (e) => {
            if (!fotoCarregada) return;
            e.preventDefault();
            previewCanvas.setPointerCapture(e.pointerId);
            dragging = true;
            pointerId = e.pointerId;
            startPointerX = e.clientX;
            startPointerY = e.clientY;
            startPanX = panOffsetX;
            startPanY = panOffsetY;
        });

        previewCanvas.addEventListener('pointermove', (e) => {
            if (!dragging || e.pointerId !== pointerId) return;
            e.preventDefault();

            const deltaX = e.clientX - startPointerX;
            const deltaY = e.clientY - startPointerY;

            const img = previewPhoto;
            const baseCrop = Math.min(img.naturalWidth, img.naturalHeight);
            const zoomScale = zoomAtual / 100;
            const sourceSize = Math.max(1, Math.round(baseCrop / zoomScale));

            // diâmetro do círculo de foto, em pixels CSS (independe do devicePixelRatio)
            const displayedDiameterCSS = 2 * HOLE_R_FRAC * previewCanvas.clientWidth;
            const scale = sourceSize / displayedDiameterCSS;

            panOffsetX = startPanX - Math.round(deltaX * scale);
            panOffsetY = startPanY - Math.round(deltaY * scale);

            renderPreview();
        });

        function endPointer(e){
            if(e && e.pointerId && e.pointerId===pointerId){
                try{ previewCanvas.releasePointerCapture(e.pointerId);}catch(_){ }
            }
            dragging=false;
            pointerId=null;
        }
        previewCanvas.addEventListener('pointerup', endPointer);
        previewCanvas.addEventListener('pointercancel', endPointer);

        function setCanvasSize(){
            const dpr = window.devicePixelRatio || 1;
            const displayW = previewCanvas.clientWidth;
            const displayH = previewCanvas.clientHeight;
            previewCanvas.width = Math.round(displayW * dpr);
            previewCanvas.height = Math.round(displayH * dpr);
        }

        // Desenha a foto (recortada em círculo, na posição exata do furo) e
        // depois a moldura por cima, sem esticar — moldura sempre desenhada
        // do tamanho exato do canvas, que tem a mesma proporção 862:972 da
        // arte original, então nada é distorcido e as letras brancas ficam
        // 100% opacas.
        function drawComposite(ctx, w, h){
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            if (fotoCarregada) {
                const img = previewPhoto;
                const baseCrop = Math.min(img.naturalWidth, img.naturalHeight);
                const zoomScale = zoomAtual / 100;
                const sourceSize = Math.max(1, Math.round(baseCrop / zoomScale));
                const sx0 = img.naturalWidth > img.naturalHeight ? Math.floor((img.naturalWidth - baseCrop) / 2) : 0;
                const sy0 = img.naturalHeight > img.naturalWidth ? Math.floor((img.naturalHeight - baseCrop) / 2) : 0;
                const sx = sx0 + Math.round(panOffsetX);
                const sy = sy0 + Math.round(panOffsetY);

                const holeCX = HOLE_CX_FRAC * w;
                const holeCY = HOLE_CY_FRAC * h;
                const holeR  = HOLE_R_FRAC * w;
                const destSize = holeR * 2;
                const destX = holeCX - holeR;
                const destY = holeCY - holeR;

                ctx.save();
                ctx.beginPath();
                ctx.arc(holeCX, holeCY, holeR, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(img, sx, sy, sourceSize, sourceSize, destX, destY, destSize, destSize);
                ctx.restore();
            }

            if (molduraLoaded) {
                ctx.drawImage(molduraImage, 0, 0, w, h);
            }
        }

        function renderPreview(){
            setCanvasSize();
            drawComposite(previewCtx, previewCanvas.width, previewCanvas.height);
        }

        function baixarFoto(){
            if(!fotoCarregada) return;
            const outW = OUTPUT_WIDTH;
            const outH = Math.round(outW * molduraImage.naturalHeight / molduraImage.naturalWidth);
            canvasFinal.width = outW;
            canvasFinal.height = outH;

            drawComposite(ctxFinal, outW, outH);

            // Compatível com iOS/iPhone - usa Blob em vez de Data URL
            canvasFinal.toBlob(blob => {
                if (!blob) {
                    alert('Erro ao gerar a imagem. Tente novamente.');
                    return;
                }

                const blobUrl = URL.createObjectURL(blob);
                hiddenLink.href = blobUrl;
                hiddenLink.download = 'Pedro_Gama_4030_Foto_de_Apoio.png';
                
                // Detecta iOS/Safari
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
                const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
                
                if (isIOS || isSafari) {
                    // No iOS, abre em nova aba para o usuário salvar
                    window.open(blobUrl, '_blank');
                } else {
                    // Em outros navegadores, faz download direto
                    hiddenLink.click();
                }
                
                // Limpa o blob URL após um tempo
                setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
            }, 'image/png');
        }

        function refazer(){
            fileInput.value = '';
            fotoCarregada = false;
            previewArea.classList.remove('active');
            controlsArea.classList.remove('active');
            previewCtx.clearRect(0,0,previewCanvas.width, previewCanvas.height);
        }

        window.addEventListener('resize', ()=>{ if (fotoCarregada || molduraLoaded) renderPreview(); });

        previewCanvas.addEventListener('dblclick', ()=>{
            if(!fotoCarregada) return;
            zoomAtual = 100;
            zoomRange.value = 100;
            zoomValue.textContent = '100%';
            panOffsetX = 0;
            panOffsetY = 0;
            renderPreview();
        });
    </script>
</body>
</html>
